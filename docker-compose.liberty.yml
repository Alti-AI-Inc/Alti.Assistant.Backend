version: '3.8'

networks:
  liberty-mesh:
    driver: bridge
    internal: true

services:
  aphura-moe-router:
    build:
      context: .
      dockerfile: Dockerfile.liberty-engine
    networks:
      - liberty-mesh
    ports:
      - "5000:5000"
    environment:
      - ENGINE_ROLE=ROUTER
    restart: always

