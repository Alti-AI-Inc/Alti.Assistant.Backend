# ==========================================
# LIBERTY CENTER ONE - SOVEREIGN BACKEND
# 100% Entrenched, Dockerized, and Isolated
# ==========================================
version: '3.8'

networks:
  liberty-mesh:
    driver: bridge
    internal: true # Secure sovereign mesh

services:
  aphura-moe-router:
    build: 
      context: .
      dockerfile: Dockerfile.liberty-engine
    networks:
      - liberty-mesh
    ports:
      - "5000:5000"
    environment:
      - ENGINE_ROLE=ROUTER

  engine-triposr:
    build:
      context: .
      dockerfile: Dockerfile.liberty-engine
    networks:
