events {
    worker_connections 1024;
}

http {
    upstream aphura_core {
        server aphura-core:4000;
    }
    
    upstream agent_research {
        server agent-research:4001;
    }
    
    upstream agent_monitor {
        server agent-monitor:4002;
    }
    
    upstream agent_workflow {
        server agent-workflow:4003;
    }

    server {
        listen 80;
        
        # Standard Chat / Main Monolith
        location / {
            proxy_pass http://aphura_core;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Isolated Deep Research Agent
        location /api/v1/research/ {
            proxy_pass http://agent_research;
            proxy_set_header Host $host;
            
            # SSE Streaming Support
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
        }

        # Isolated Monitor Changes Agent
        location /api/v1/monitor/ {
            proxy_pass http://agent_monitor;
            proxy_set_header Host $host;
            
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
        }

        # Isolated Automate Workflows Agent
        location /api/v1/workflow/ {
            proxy_pass http://agent_workflow;
            proxy_set_header Host $host;
            
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
        }
    }
}
