events {
    worker_connections 1024;
}

http {
    upstream agent_search {
        server agent-search:4001;
    }
    upstream agent_research {
        server agent-research:4002;
    }
    upstream agent_write {
        server agent-write:4003;
    }
    upstream agent_code {
        server agent-code:4004;
    }
    upstream agent_design {
        server agent-design:4005;
    }
    upstream agent_video {
        server agent-video:4006;
    }
    upstream agent_audio {
        server agent-audio:4007;
    }

    server {
        listen 4000;

        location /api/v1/search/ {
            proxy_pass http://agent_search;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/research/ {
            proxy_pass http://agent_research;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/write/ {
            proxy_pass http://agent_write;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/code/ {
            proxy_pass http://agent_code;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/design/ {
            proxy_pass http://agent_design;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/video/ {
            proxy_pass http://agent_video;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/audio/ {
            proxy_pass http://agent_audio;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
