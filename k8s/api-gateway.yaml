apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aphura-api-gateway
  namespace: aphura-production
  annotations:
    kubernetes.io/ingress.class: kong
    konghq.com/strip-path: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - api.aphura.ai
    secretName: aphura-api-tls
  rules:
  - host: api.aphura.ai
    http:
      paths:
      - path: /v1/graphql
        pathType: Prefix
        backend:
          service:
            name: aphura-backend-service
            port:
              number: 3001
      - path: /v1/mcp
        pathType: Prefix
        backend:
          service:
            name: aphura-backend-service
            port:
              number: 3001
      - path: /v1/realtime
        pathType: Prefix
        backend:
          service:
            name: aphura-backend-service
            port:
              number: 3001
      - path: /
        pathType: Prefix
        backend:
          service:
            name: aphura-backend-service
            port:
              number: 3001
