apiVersion: apps/v1
kind: Deployment
metadata:
  name: aphura-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aphura-backend
  template:
    metadata:
      labels:
        app: aphura-backend
    spec:
      containers:
      - name: aphura-backend
        image: alti-ai/aphura-backend:latest
        ports:
        - containerPort: 3001
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /readiness
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 5
