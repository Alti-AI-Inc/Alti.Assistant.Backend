apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: aphura-agent-scaler
  namespace: aphura-production
spec:
  scaleTargetRef:
    name: aphura-backend-deployment
  minReplicaCount: 2
  maxReplicaCount: 1000
  triggers:
  - type: prometheus
    metadata:
      serverAddress: http://prometheus-server.monitoring.svc.cluster.local:9090
      metricName: together_ai_queue_depth
      threshold: '50'
      query: sum(rate(aphura_together_inference_requests_pending[1m]))
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aphura-hpa
  namespace: aphura-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aphura-backend-deployment
  minReplicas: 2
  maxReplicas: 100
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
