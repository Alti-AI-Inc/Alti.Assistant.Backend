substitutions:
  _SERVICE_NAME: inso-assistant-backend
  _REGION: us-central1
  _ARTIFACT_REPO: inso-assistant-core-backend-repo
  _COMMIT_SHA: latest
  _VPC_CONNECTOR: inso-vpc-connector # Serverless VPC connector for private DB/Cache access
  _NODE_ENV: production

steps:
  # 1. Build the backend container image
  - name: gcr.io/cloud-builders/docker
    id: build
    args:
      - build
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_SERVICE_NAME}:${_COMMIT_SHA}
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_SERVICE_NAME}:latest
      - --cache-from
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_SERVICE_NAME}:latest
      - .

  # 2. Push image to GCP Artifact Registry
  - name: gcr.io/cloud-builders/docker
    id: push
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_SERVICE_NAME}

  # 3. Deploy to Google Cloud Run
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_SERVICE_NAME}:${_COMMIT_SHA}
      - --region
      - ${_REGION}
      - --platform
      - managed
      - --allow-unauthenticated
      - --port
      - '8080'
      - --min-instances
      - '1'
      - --max-instances
      - '4'
      - --memory
      - '4Gi'
      - --cpu
      - '2'
      - --execution-environment
      - gen2
      - --vpc-connector
      - ${_VPC_CONNECTOR}
      # Set non-secret env vars
      - --set-env-vars
      - NODE_ENV=${_NODE_ENV},PORT=8080,LLM_PROVIDER=gcp
      # Map all sensitive variables directly from GCP Secret Manager
      - --set-secrets
      - DATABASE_LOCAL=DATABASE_LOCAL:latest,REDIS_URL=REDIS_URL:latest,JWT_ACCESS_TOKEN=JWT_ACCESS_TOKEN:latest,JWT_REFRESH_REFRESH_TOKEN=JWT_REFRESH_REFRESH_TOKEN:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest,ALLOYDB_HOST=ALLOYDB_HOST:latest,ALLOYDB_PORT=ALLOYDB_PORT:latest,ALLOYDB_DATABASE=ALLOYDB_DATABASE:latest,ALLOYDB_USER=ALLOYDB_USER:latest,ALLOYDB_PASSWORD=ALLOYDB_PASSWORD:latest,TEMPORAL_ADDRESS=TEMPORAL_ADDRESS:latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_SERVICE_NAME}:${_COMMIT_SHA}
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_SERVICE_NAME}:latest

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
