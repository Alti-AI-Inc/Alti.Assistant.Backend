services:
  inso-backend:
    image: us-central1-docker.pkg.dev/gen-lang-client-0273900650/inso-assistant-core-backend-repo/inso-assistant-backend:latest
    container_name: inso-backend
    restart: unless-stopped
    ports:
      - '5100:5100'
    env_file:
      - .env
    environment:
      # Override Presenton URL to use internal container network
      - PRESENTON_API_URL=http://presenton:80
      - PORT=5100
    volumes:
      # Shared volume with Presenton - Presenton's /app_data mounted to backend's /app/presenton_files
      - presenton_data:/app/presenton_files
      # Your application logs and uploads
      - ./logs:/app/inso-core-service/logs
      - ./uploads:/app/inso-core-service/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:' + (process.env.PORT || 5100) + '/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 300s
      retries: 5
    networks:
      - app-network
    depends_on:
      - presenton

  presenton:
    image: ghcr.io/presenton/presenton:latest
    container_name: presenton
    restart: unless-stopped
    environment:
      - LLM=google
      - GOOGLE_API_KEY=${GEMINI_API_KEY}
      - IMAGE_PROVIDER=gemini_flash
      - CAN_CHANGE_KEYS=false
    volumes:
      # Presenton stores files in /app_data
      - presenton_data:/app_data
    networks:
      - app-network
    # Optionally expose Presenton port for debugging
    ports:
      - '5200:80'

networks:
  app-network:
    driver: bridge

volumes:
  presenton_data:
    driver: local
