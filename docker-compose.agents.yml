version: '3.8'

services:
  agent-search:
    build:
      context: .
      dockerfile: Dockerfile.search
    container_name: aphura-agent-search
    ports:
      - "4001:4001"
    env_file: .env
    restart: unless-stopped
    networks:
      - aphura_network

  agent-research:
    build:
      context: .
      dockerfile: Dockerfile.research
    container_name: aphura-agent-research
    ports:
      - "4002:4002"
    env_file: .env
    restart: unless-stopped
    networks:
      - aphura_network

  agent-write:
    build:
      context: .
      dockerfile: Dockerfile.write
    container_name: aphura-agent-write
    ports:
      - "4003:4003"
    env_file: .env
    restart: unless-stopped
    networks:
      - aphura_network

  agent-code:
    build:
      context: .
      dockerfile: Dockerfile.code
    container_name: aphura-agent-code
    ports:
      - "4004:4004"
    env_file: .env
    restart: unless-stopped
    networks:
      - aphura_network

  agent-design:
    build:
      context: .
      dockerfile: Dockerfile.design
    container_name: aphura-agent-design
    ports:
      - "4005:4005"
    env_file: .env
    restart: unless-stopped
    networks:
      - aphura_network

  agent-video:
    build:
      context: .
      dockerfile: Dockerfile.video
    container_name: aphura-agent-video
    ports:
      - "4006:4006"
    env_file: .env
    restart: unless-stopped
    networks:
      - aphura_network

  agent-audio:
    build:
      context: .
      dockerfile: Dockerfile.audio
    container_name: aphura-agent-audio
    ports:
      - "4007:4007"
    env_file: .env
    restart: unless-stopped
    networks:
      - aphura_network

  api-gateway:
    image: nginx:alpine
    container_name: aphura-api-gateway
    ports:
      - "4000:4000"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - agent-search
      - agent-research
      - agent-write
      - agent-code
      - agent-design
      - agent-video
      - agent-audio
    networks:
      - aphura_network

networks:
  aphura_network:
    driver: bridge
