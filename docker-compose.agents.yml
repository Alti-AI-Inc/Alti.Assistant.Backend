version: '3.8'

services:
  # The API Gateway (Nginx) exposed on port 4000
  api-gateway:
    image: nginx:alpine
    container_name: aphura-api-gateway
    ports:
      - "4000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - aphura-core
      - agent-research
      - agent-monitor
      - agent-workflow

  # Main Node.js Monolith (Basic Chat, Auth, etc)
  aphura-core:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: aphura-core
    env_file: .env
    environment:
      - PORT=4000
    expose:
      - "4000"

  # ISOLATED: Deep Research Engine
  agent-research:
    build:
      context: .
      dockerfile: Dockerfile.research
    container_name: aphura-agent-research
    env_file: .env
    expose:
      - "4001"

  # ISOLATED: Semantic DOM Monitor Engine
  agent-monitor:
    build:
      context: .
      dockerfile: Dockerfile.monitor
    container_name: aphura-agent-monitor
    env_file: .env
    expose:
      - "4002"

  # ISOLATED: DAG Workflow Orchestrator
  agent-workflow:
    build:
      context: .
      dockerfile: Dockerfile.workflow
    container_name: aphura-agent-workflow
    env_file: .env
    expose:
      - "4003"
