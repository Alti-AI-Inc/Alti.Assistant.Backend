steps:
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - 'docker pull $_IMAGE_TAG || true'
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-t', '$_IMAGE_TAG',
      '--cache-from', '$_IMAGE_TAG',
      '.'
    ]
images:
  - '$_IMAGE_TAG'
