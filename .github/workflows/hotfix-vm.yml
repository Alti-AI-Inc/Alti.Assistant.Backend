name: Full Deploy to VM (Hotfix)

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Full Codebase to Production VM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/alti-vm-key
          chmod 600 ~/.ssh/alti-vm-key
          ssh-keyscan -H 35.239.192.33 >> ~/.ssh/known_hosts

      - name: Package application code
        run: |
          # Create a tarball of just the application code (no node_modules, no secrets)
          tar czf /tmp/app-code.tar.gz \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='env' \
            --exclude='env.yaml' \
            --exclude='test' \
            --exclude='scratch' \
            --exclude='data' \
            --exclude='db_data' \
            --exclude='*.tar.gz' \
            --exclude='*.zip' \
            -C . \
            src/ config/ index.js server.js package.json preload.cjs imagegen.json

          echo "Archive size: $(du -h /tmp/app-code.tar.gz | cut -f1)"

      - name: Upload code to VM
        run: |
          scp -i ~/.ssh/alti-vm-key /tmp/app-code.tar.gz \
            alti_deployer@35.239.192.33:/tmp/app-code.tar.gz

      - name: Deploy into container and restart
        run: |
          ssh -i ~/.ssh/alti-vm-key alti_deployer@35.239.192.33 bash <<'DEPLOY'
            set -e

            CONTAINER="alti-backend"

            echo "=== Finding app root in container ==="
            APP_ROOT=$(docker exec $CONTAINER pwd)
            echo "Container workdir: $APP_ROOT"

            echo "=== Extracting code into container ==="
            # Create staging dir on host, extract, then docker cp
            mkdir -p /tmp/app-staging
            cd /tmp/app-staging
            tar xzf /tmp/app-code.tar.gz

            echo "=== Copying files into container ==="
            for item in src config index.js server.js package.json preload.cjs imagegen.json; do
              if [ -e "$item" ]; then
                docker cp "$item" "$CONTAINER:$APP_ROOT/$item"
                echo "  ✅ $item"
              fi
            done

            echo "=== Verifying key changes ==="
            # Check graceful shutdown
            docker exec $CONTAINER grep -c "gracefulShutdown" index.js && echo "  ✅ Graceful shutdown present" || echo "  ❌ Graceful shutdown missing"
            # Check Sentry
            docker exec $CONTAINER grep -c "initSentry" index.js && echo "  ✅ Sentry integration present" || echo "  ❌ Sentry missing"
            # Check CORS fix
            docker exec $CONTAINER grep -c "allowedOrigins" index.js && echo "  ✅ CORS fix present" || echo "  ❌ CORS fix missing"
            # Check health check
            docker exec $CONTAINER grep -c "mongoose.connection.readyState" index.js && echo "  ✅ Deep health check present" || echo "  ❌ Deep health check missing"
            # Check orchestrator
            docker exec $CONTAINER grep -c "classifyLocally" src/app/modules/orchestrator/orchestrator.service.js && echo "  ✅ Orchestrator fix present" || echo "  ❌ Orchestrator fix missing"

            echo "=== Restarting container ==="
            docker restart $CONTAINER

            echo "=== Waiting for startup ==="
            sleep 12

            echo "=== Container status ==="
            docker ps --filter name=$CONTAINER --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

            echo "=== Startup logs ==="
            docker logs --tail=40 $CONTAINER 2>&1

            echo "=== Cleanup ==="
            rm -rf /tmp/app-staging /tmp/app-code.tar.gz

            echo "=== Full deploy complete! ==="
          DEPLOY

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/alti-vm-key
