name: Full Deploy to VM (Hotfix)

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Full Codebase to Production VM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/alti-vm-key
          chmod 600 ~/.ssh/alti-vm-key
          ssh-keyscan -H 35.239.192.33 >> ~/.ssh/known_hosts

      - name: Package application code
        run: |
          tar czf /tmp/app-code.tar.gz \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='env' \
            --exclude='env.yaml' \
            --exclude='test' \
            --exclude='scratch' \
            --exclude='data' \
            --exclude='db_data' \
            --exclude='*.tar.gz' \
            --exclude='*.zip' \
            -C . \
            src/ config/ index.js server.js package.json preload.cjs imagegen.json

          echo "Archive size: $(du -h /tmp/app-code.tar.gz | cut -f1)"

      - name: Upload code to VM
        run: |
          scp -i ~/.ssh/alti-vm-key /tmp/app-code.tar.gz \
            alti_deployer@35.239.192.33:/tmp/app-code.tar.gz

      - name: Deploy into container and restart
        run: |
          ssh -i ~/.ssh/alti-vm-key alti_deployer@35.239.192.33 bash <<'DEPLOY'
            set -e

            CONTAINER="alti-backend"
            APP_ROOT="/app/alti-core-service"

            echo "=== Extracting code on host ==="
            rm -rf /tmp/app-staging
            mkdir -p /tmp/app-staging
            cd /tmp/app-staging
            tar xzf /tmp/app-code.tar.gz

            # ── Stop container to break any crash-restart loop ──
            echo "=== Stopping container ==="
            docker stop $CONTAINER 2>/dev/null || true
            sleep 2

            # ── Save old package.json BEFORE overwriting (for dep diff) ──
            docker cp "$CONTAINER:$APP_ROOT/package.json" /tmp/old-pkg.json 2>/dev/null || true

            # ── Copy files using docker cp (works on stopped containers) ──
            echo "=== Copying files into container ==="
            cd /tmp/app-staging

            # Copy root files
            for item in config index.js server.js package.json preload.cjs imagegen.json; do
              if [ -e "/tmp/app-staging/$item" ]; then
                docker cp "/tmp/app-staging/$item" "$CONTAINER:$APP_ROOT/$item"
                echo "  ✅ $item"
              fi
            done

            # Merge src/ directory
            docker cp src/. "$CONTAINER:$APP_ROOT/src/"
            echo "  ✅ src/ merged"

            # ── Install any NEW dependencies into the stopped container ──
            echo "=== Syncing dependencies ==="
            MISSING=""
            if [ -f /tmp/old-pkg.json ]; then
              MISSING=$(node -e "
                const o=require('/tmp/old-pkg.json').dependencies||{};
                const n=require('/tmp/app-staging/package.json').dependencies||{};
                const m=Object.keys(n).filter(k=>!o[k]);
                if(m.length)console.log(m.join(' '));
              " 2>/dev/null || echo "")
            fi
            if [ -n "$MISSING" ]; then
              echo "  New packages: $MISSING"
              mkdir -p /tmp/npm-tmp && cd /tmp/npm-tmp
              npm init -y > /dev/null 2>&1
              npm install $MISSING --legacy-peer-deps 2>&1 | tail -3
              for pkg in $MISSING; do
                if [ -d "/tmp/npm-tmp/node_modules/$pkg" ]; then
                  docker cp "/tmp/npm-tmp/node_modules/$pkg" "$CONTAINER:$APP_ROOT/node_modules/$pkg"
                  echo "  ✅ Installed: $pkg"
                fi
              done
              rm -rf /tmp/npm-tmp
            else
              echo "  ✅ No new dependencies"
            fi
            rm -f /tmp/old-pkg.json

            # ── Start the container (now with all deps) ──
            echo "=== Starting container ==="
            docker start $CONTAINER
            sleep 10

            echo "=== Verifying key changes ==="
            docker exec $CONTAINER grep -c "gracefulShutdown" index.js && echo "  ✅ Graceful shutdown" || echo "  ❌ Graceful shutdown"
            docker exec $CONTAINER grep -c "initSentry" index.js && echo "  ✅ Sentry integration" || echo "  ❌ Sentry"
            docker exec $CONTAINER grep -c "allowedOrigins" index.js && echo "  ✅ CORS fix" || echo "  ❌ CORS fix"
            docker exec $CONTAINER grep -c "mongoose.connection.readyState" index.js && echo "  ✅ Deep health check" || echo "  ❌ Deep health check"
            docker exec $CONTAINER grep -c "MODULE_REGISTRY" src/app/modules/orchestrator/orchestrator.service.js && echo "  ✅ Orchestrator v2" || echo "  ❌ Orchestrator v2"
            docker exec $CONTAINER grep -c "gemini-2.5-flash" src/app/modules/orchestrator/orchestrator.service.js && echo "  ✅ Model name fixed" || echo "  ❌ Model name"
            docker exec $CONTAINER test -f src/shared/tenantGuardrail.js && echo "  ✅ tenantGuardrail.js intact" || echo "  ❌ tenantGuardrail.js MISSING"
            docker exec $CONTAINER test -f src/shared/sentry.js && echo "  ✅ sentry.js present" || echo "  ❌ sentry.js missing"

            echo "=== Restarting container (clean start) ==="
            docker restart $CONTAINER

            echo "=== Waiting for startup (20s) ==="
            sleep 20

            echo "=== Container status ==="
            docker ps --filter name=$CONTAINER --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

            echo "=== Post-deploy smoke test ==="
            HEALTH=$(docker exec $CONTAINER node -e "fetch('http://localhost:5100/health').then(r=>r.json()).then(d=>console.log(JSON.stringify(d))).catch(e=>console.log('FAIL:'+e.message))" 2>&1) || true
            if echo "$HEALTH" | grep -q '"success":true'; then
              echo "  ✅ Health check passed: $HEALTH"
            else
              echo "  ⚠️ Health check response: $HEALTH"
            fi

            echo "=== Phase 3+ verifications ==="
            docker exec $CONTAINER grep -c "compression" index.js && echo "  ✅ Compression middleware" || echo "  ❌ Compression"
            docker exec $CONTAINER grep -c "requestIdMiddleware" index.js && echo "  ✅ Request ID tracing" || echo "  ❌ Request ID"
            docker exec $CONTAINER grep -c "REQUIRED_ENV" index.js && echo "  ✅ Startup env validation" || echo "  ❌ Env validation"
            docker exec $CONTAINER grep -c "maxPoolSize" index.js && echo "  ✅ MongoDB pool tuning" || echo "  ❌ Pool tuning"
            docker exec $CONTAINER test -f src/app/middlewares/requestId.js && echo "  ✅ requestId.js present" || echo "  ❌ requestId.js missing"

            echo "=== Startup logs ==="
            docker logs --tail=40 $CONTAINER 2>&1

            echo "=== Cleanup ==="
            rm -rf /tmp/app-staging /tmp/app-code.tar.gz

            echo "=== Full deploy complete! ==="
          DEPLOY

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/alti-vm-key

