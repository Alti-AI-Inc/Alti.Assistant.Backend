name: Deploy Code to VM (Direct)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy (e.g. main, dev)'
        required: true
        default: 'dev'
  push:
    branches:
      - dev
    paths-ignore:
      - 'data/**'
      - '*.md'

env:
  VM_HOST: ${{ secrets.VM_HOST }}
  VM_USER: ${{ secrets.VM_USER }}
  REGISTRY: us-central1-docker.pkg.dev
  IMAGE: us-central1-docker.pkg.dev/gen-lang-client-0273900650/inso-assistant-core-backend-repo/inso-assistant-backend

permissions:
  contents: read

jobs:
  deploy:
    name: Build, Push & Deploy to VM
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref_name }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Log in to Google Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: _json_key
          password: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/inso-vm-key
          chmod 600 ~/.ssh/inso-vm-key
          ssh-keyscan -H ${{ env.VM_HOST }} >> ~/.ssh/known_hosts

      - name: Copy docker-compose to VM
        run: |
          scp -i ~/.ssh/inso-vm-key -o StrictHostKeyChecking=no \
            docker-compose.yml ${{ env.VM_USER }}@${{ env.VM_HOST }}:~/docker-compose.yml

      - name: Deploy to VM
        run: |
          ssh -i ~/.ssh/inso-vm-key ${{ env.VM_USER }}@${{ env.VM_HOST }} bash -s << 'EOF'
            set -e

            echo "=== Step 1: Stop containers (release image locks) ==="
            docker compose -f ~/docker-compose.yml down --remove-orphans 2>/dev/null || true

            echo "=== Step 2: Aggressive disk cleanup BEFORE pull ==="
            sudo systemctl restart docker || sudo service docker restart || true
            docker system prune -af 2>/dev/null || true
            docker container prune -f 2>/dev/null || true
            docker image rm us-central1-docker.pkg.dev/gen-lang-client-0273900650/inso-assistant-core-backend-repo/inso-assistant-backend:latest 2>/dev/null || true
            docker image prune -af 2>/dev/null || true
            docker volume prune -f 2>/dev/null || true
            docker builder prune -af 2>/dev/null || true
            df -h / | tail -1

            AVAIL=$(df / | awk 'NR==2 {print $4}')
            if [ "$AVAIL" -lt 1048576 ]; then
              echo "ERROR: Less than 1GB free after prune ($AVAIL KB). Aborting."
              exit 1
            fi
            echo "Disk OK: ${AVAIL}KB available"

            echo "=== Step 3: Fix .env CRLF (Docker env_file requires LF) ==="
            [ -f ~/.env ] && sed -i 's/\r//' ~/.env && echo ".env CRLF stripped"

            echo "=== Step 4: Authenticate with Artifact Registry ==="
            mkdir -p ~/.docker
            echo '{}' > ~/.docker/config.json
            echo '${{ secrets.GCP_SA_KEY }}' | docker login -u _json_key --password-stdin https://us-central1-docker.pkg.dev

            echo "=== Step 5: Pull latest images ==="
            docker compose -f ~/docker-compose.yml pull

            echo "=== Step 6: Start containers ==="
            docker compose -f ~/docker-compose.yml up -d

            echo "=== Step 7: Status + disk ==="
            docker compose -f ~/docker-compose.yml ps
            df -h /

            echo "=== Deploy complete! ==="
          EOF

      - name: Health check
        run: |
          echo "Waiting 30s for backend to start..."
          sleep 30
          ssh -i ~/.ssh/inso-vm-key ${{ env.VM_USER }}@${{ env.VM_HOST }} \
            "curl -sf http://localhost:5100/health && echo ' ✅ Backend healthy' || echo ' ❌ Health check failed'"

      - name: Fetch recent logs
        if: always()
        run: |
          ssh -i ~/.ssh/inso-vm-key ${{ env.VM_USER }}@${{ env.VM_HOST }} \
            "docker logs inso-backend --tail=20 2>&1" || true

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/inso-vm-key
