name: Backend CI

on:
  push:
    branches:
      - main
      - dev

jobs:
  backend-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
        continue-on-error: true
