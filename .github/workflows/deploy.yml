name: Deploy to VM

on:
  push:
    branches:
      - dev

permissions:
  contents: read
env:
  REGISTRY: us-central1-docker.pkg.dev/alti-assistant-prod/alti-assistant-core-backend-repo
  IMAGE_NAME: alti-assistant-backend
  VM_USER: alti_deployer
  COMPOSE_DIR: '~'
  COMPOSE_FILE: docker-compose.yml

jobs:
  build-and-deploy:
    name: Build, Push & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up version tag
        id: vars
        run: |
          VERSION="v$(date +'%Y%m%d')-${GITHUB_SHA::7}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "image_version=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$VERSION" >> $GITHUB_OUTPUT
          echo "image_latest=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_OUTPUT

      - name: Authenticate to Google Cloud
        id: auth_setup
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Ensure Sandbox VM is Provisioned
        run: |
          INSTANCE_NAME="alti-sandbox-vm"
          ZONE="us-central1-a"
          
          echo "Checking if instance $INSTANCE_NAME exists..."
          if ! gcloud compute instances describe $INSTANCE_NAME --zone=$ZONE --project=alti-assistant-prod > /dev/null 2>&1; then
            echo "Instance $INSTANCE_NAME does not exist. Provisioning..."
            gcloud compute instances create $INSTANCE_NAME \
              --project=alti-assistant-prod \
              --zone=$ZONE \
              --machine-type=e2-medium \
              --image-family=ubuntu-2204-lts \
              --image-project=ubuntu-os-cloud \
              --metadata-from-file=startup-script=scripts/setup-sandbox.sh \
              --tags=http-server,https-server \
              --quiet
              
            echo "Waiting for VM to boot and run startup script (approx 60s)..."
            sleep 60
          else
            echo "Instance $INSTANCE_NAME is already running."
          fi
          
          VM_IP=$(gcloud compute instances describe $INSTANCE_NAME --zone=$ZONE --project=alti-assistant-prod --format='get(networkInterfaces[0].accessConfigs[0].natIP)')
          echo "Discovered dynamic IP: $VM_IP"
          echo "VM_HOST=$VM_IP" >> $GITHUB_ENV

      - name: Ensure Artifact Registry repository exists
        continue-on-error: true
        run: |
          gcloud artifacts repositories create alti-assistant-core-backend-repo \
            --repository-format=docker \
            --location=us-central1 \
            --project=alti-assistant-prod \
            --description="Alti assistant core backend Docker images" --quiet || true

      - name: Log in to Google Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: us-central1-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.vars.outputs.image_version }}
            ${{ steps.vars.outputs.image_latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up SSH key and Metadata
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/alti-vm-key
          chmod 600 ~/.ssh/alti-vm-key
          
          ssh-keygen -y -f ~/.ssh/alti-vm-key > ~/.ssh/alti-vm-key.pub
          echo "${{ env.VM_USER }}:$(cat ~/.ssh/alti-vm-key.pub)" > /tmp/ssh_keys
          gcloud compute instances add-metadata alti-sandbox-vm --project=alti-assistant-prod --zone=us-central1-a --metadata-from-file=ssh-keys=/tmp/ssh_keys
          
          sleep 10
          ssh-keyscan -H ${{ env.VM_HOST }} >> ~/.ssh/known_hosts

      - name: Copy docker-compose to VM
        run: |
          scp -i ~/.ssh/alti-vm-key -o StrictHostKeyChecking=no docker-compose.yml ${{ env.VM_USER }}@${{ env.VM_HOST }}:${{ env.COMPOSE_DIR }}/docker-compose.yml

      - name: Deploy to VM
        run: |
          ssh -i ~/.ssh/alti-vm-key ${{ env.VM_USER }}@${{ env.VM_HOST }} bash << 'EOF'
            set -e
            echo "Navigating to compose directory..."
            cd ${{ env.COMPOSE_DIR }}
            echo "Stopping existing containers..."
            docker compose -f ${{ env.COMPOSE_FILE }} down
            echo "Pulling latest images..."
            docker compose -f ${{ env.COMPOSE_FILE }} pull
            echo "Starting containers..."
            docker compose -f ${{ env.COMPOSE_FILE }} up -d
            echo "Checking container status..."
            docker compose -f ${{ env.COMPOSE_FILE }} ps
            echo "Deployment completed successfully!"
          EOF

      - name: Fetch recent logs
        run: |
          ssh -i ~/.ssh/alti-vm-key ${{ env.VM_USER }}@${{ env.VM_HOST }} \
            "cd ${{ env.COMPOSE_DIR }} && docker compose -f ${{ env.COMPOSE_FILE }} logs --tail=20"

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/alti-vm-key
