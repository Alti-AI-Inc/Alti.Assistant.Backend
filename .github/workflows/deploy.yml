name: Deploy to VM

on:
  push:
    branches:
      - dev

permissions:
  contents: read

env:
  REGISTRY: us-central1-docker.pkg.dev/gen-lang-client-0273900650/alti-assistant-core-backend-repo
  IMAGE_NAME: alti-assistant-backend
  VM_USER: alti_deployer
  COMPOSE_DIR: '~'
  COMPOSE_FILE: docker-compose.yml
  # Opt into Node.js 24 for all actions (Node 20 deprecated June 2026)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    name: Build, Push & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up version tag
        id: vars
        run: |
          VERSION="v$(date +'%Y%m%d')-${GITHUB_SHA::7}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "image_version=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$VERSION" >> $GITHUB_OUTPUT
          echo "image_latest=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_OUTPUT

      - name: Authenticate to Google Cloud
        id: auth_setup
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Ensure Sandbox VM is Provisioned
        run: |
          INSTANCE_NAME="alti-sandbox-vm"
          ZONE="us-central1-a"
          
          echo "Checking if instance $INSTANCE_NAME exists..."
          if ! gcloud compute instances describe $INSTANCE_NAME --zone=$ZONE --project=gen-lang-client-0273900650 > /dev/null 2>&1; then
            echo "Instance $INSTANCE_NAME does not exist. Provisioning..."
            gcloud compute instances create $INSTANCE_NAME \
              --project=gen-lang-client-0273900650 \
              --zone=$ZONE \
              --machine-type=e2-medium \
              --image-family=ubuntu-2204-lts \
              --image-project=ubuntu-os-cloud \
              --metadata-from-file=startup-script=scripts/setup-sandbox.sh \
              --tags=http-server,https-server \
              --quiet
              
            echo "Waiting for VM to boot and run startup script (approx 60s)..."
            sleep 60
          else
            echo "Instance $INSTANCE_NAME exists."
            STATUS=$(gcloud compute instances describe $INSTANCE_NAME --zone=$ZONE --project=gen-lang-client-0273900650 --format='get(status)')
            echo "Current status: $STATUS"
            if [ "$STATUS" != "RUNNING" ]; then
              echo "Starting stopped instance $INSTANCE_NAME..."
              gcloud compute instances start $INSTANCE_NAME --zone=$ZONE --project=gen-lang-client-0273900650 --quiet
              echo "Waiting for VM to boot (approx 30s)..."
              sleep 30
            fi
          fi
          
          VM_IP=$(gcloud compute instances describe $INSTANCE_NAME --zone=$ZONE --project=gen-lang-client-0273900650 --format='get(networkInterfaces[0].accessConfigs[0].natIP)')
          echo "Discovered dynamic IP: $VM_IP"
          echo "VM_HOST=$VM_IP" >> $GITHUB_ENV
          
          
      - name: Ensure Artifact Registry repository exists
        continue-on-error: true
        run: |
          gcloud artifacts repositories create alti-assistant-core-backend-repo \
            --repository-format=docker \
            --location=us-central1 \
            --project=gen-lang-client-0273900650 \
            --description="Alti assistant core backend Docker images" --quiet || true

      - name: Log in to Google Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: us-central1-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.vars.outputs.image_version }}
            ${{ steps.vars.outputs.image_latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up SSH key and Metadata
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/alti-vm-key
          chmod 600 ~/.ssh/alti-vm-key
          
          ssh-keygen -y -f ~/.ssh/alti-vm-key > ~/.ssh/alti-vm-key.pub
          echo "${{ env.VM_USER }}:$(cat ~/.ssh/alti-vm-key.pub)" > /tmp/ssh_keys
          gcloud compute instances add-metadata alti-sandbox-vm --project=gen-lang-client-0273900650 --zone=us-central1-a --metadata-from-file=ssh-keys=/tmp/ssh_keys
          
          sleep 10
          ssh-keyscan -H ${{ env.VM_HOST }} >> ~/.ssh/known_hosts

      - name: Copy docker-compose to VM
        run: |
          scp -i ~/.ssh/alti-vm-key -o StrictHostKeyChecking=no docker-compose.yml ${{ env.VM_USER }}@${{ env.VM_HOST }}:${{ env.COMPOSE_DIR }}/docker-compose.yml

      - name: Deploy to VM
        run: |
          ssh -i ~/.ssh/alti-vm-key ${{ env.VM_USER }}@${{ env.VM_HOST }} bash << 'EOF'
            set -e

            echo "=== Step 1: Stop existing containers (release image locks) ==="
            docker compose -f ~/docker-compose.yml down --remove-orphans 2>/dev/null || true

            echo "=== Step 2: Aggressive disk cleanup BEFORE pulling new image ==="
            sudo systemctl restart docker || sudo service docker restart || true
            docker system prune -af 2>/dev/null || true
            docker container prune -f 2>/dev/null || true
            docker image rm us-central1-docker.pkg.dev/gen-lang-client-0273900650/alti-assistant-core-backend-repo/alti-assistant-backend:latest 2>/dev/null || true
            docker image prune -af 2>/dev/null || true
            docker volume prune -f 2>/dev/null || true
            docker builder prune -af 2>/dev/null || true
            df -h / | tail -1

            AVAIL=$(df / | awk 'NR==2 {print $4}')
            if [ "$AVAIL" -lt 1048576 ]; then
              echo "ERROR: Less than 1GB free after prune. Aborting."
              exit 1
            fi
            echo "Disk OK: ${AVAIL}KB available"

            echo "=== Step 3: Fix .env CRLF line endings (Docker env_file requires LF) ==="
            if [ -f ~/.env ]; then
              sed -i 's/\r//' ~/.env
              echo ".env CRLF stripped"
            fi

            echo "=== Step 4: Authenticate with Artifact Registry ==="
            mkdir -p ~/.docker
            echo '{}' > ~/.docker/config.json
            echo '${{ secrets.GCP_SA_KEY }}' | docker login -u _json_key --password-stdin https://us-central1-docker.pkg.dev

            echo "=== Step 5: Pull latest images ==="
            docker compose -f ~/docker-compose.yml pull

            echo "=== Step 6: Start containers ==="
            docker compose -f ~/docker-compose.yml up -d

            echo "=== Step 7: Container status ==="
            docker compose -f ~/docker-compose.yml ps

            echo "=== Step 8: Disk usage after deploy ==="
            df -h /

            echo "=== Deployment completed successfully! ==="
          EOF

      - name: Health check
        run: |
          echo "Waiting 30s for backend to start..."
          sleep 30
          ssh -i ~/.ssh/alti-vm-key ${{ env.VM_USER }}@${{ env.VM_HOST }} \
            "curl -sf http://localhost:5100/health && echo ' ✅ Backend healthy' || echo ' ❌ Health check failed'"

      - name: Fetch recent logs
        if: always()
        run: |
          ssh -i ~/.ssh/alti-vm-key ${{ env.VM_USER }}@${{ env.VM_HOST }} \
            "docker compose -f ~/docker-compose.yml logs --tail=30 2>/dev/null || true"

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/alti-vm-key
