name: VM Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Check VM Environment
    runs-on: ubuntu-latest

    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/insoai-vm-key
          chmod 600 ~/.ssh/insoai-vm-key
          ssh-keyscan -H 35.239.192.33 >> ~/.ssh/known_hosts

      - name: Diagnose VM
        run: |
          ssh -i ~/.ssh/insoai-vm-key insoai_deployer@35.239.192.33 bash <<'EOF'
            echo "=== Hostname ==="
            hostname
            
            echo "=== Docker containers ==="
            docker ps -a --format "table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}"
            
            echo "=== Container Inspect (exit code, OOM, restarts) ==="
            docker inspect insoai-backend --format '{{.State.Status}} | ExitCode={{.State.ExitCode}} | OOMKilled={{.State.OOMKilled}} | RestartCount={{.RestartCount}} | StartedAt={{.State.StartedAt}} | FinishedAt={{.State.FinishedAt}}' 2>/dev/null || echo "Container not found"
            
            echo "=== CRITICAL FIX VERIFICATION ==="
            echo "--- notes.model.js line 58 (should NOT have bare JSDoc) ---"
            docker exec insoai-backend sed -n '55,65p' src/app/modules/notes/notes.model.js 2>/dev/null || echo "FAILED to read file"
            echo "--- writer.controller.js (should NOT have app.listen) ---"
            docker exec insoai-backend grep -c "app.listen" src/app/modules/writing/writer.controller.js 2>/dev/null && echo "  ❌ STILL HAS app.listen!" || echo "  ✅ app.listen removed"
            echo "--- index.js EXIT DIAGNOSTIC handler ---"
            docker exec insoai-backend grep -c "EXIT DIAGNOSTIC" index.js 2>/dev/null && echo "  ✅ EXIT handler present" || echo "  ❌ EXIT handler MISSING"
            
            echo "=== STDERR from container (last 30 lines) ==="
            docker logs insoai-backend 2>&1 1>/dev/null | tail -30
            
            echo "=== ALL logs from container (last 100 lines) ==="
            docker logs insoai-backend --tail=100 2>&1
            
            echo "=== Try manual node syntax check ==="
            docker exec insoai-backend node -e "try { require('./src/app/modules/notes/notes.model.js') } catch(e) { console.log('IMPORT ERROR:', e.message) }" 2>&1 || true
            docker exec insoai-backend node --check index.js 2>&1 || true
            
            echo "=== Memory usage ==="
            free -h
            
            echo "=== Disk space ==="
            df -h /
          EOF

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/insoai-vm-key

