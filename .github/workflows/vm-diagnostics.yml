name: VM Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Check VM Environment
    runs-on: ubuntu-latest

    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/alti-vm-key
          chmod 600 ~/.ssh/alti-vm-key
          ssh-keyscan -H 35.239.192.33 >> ~/.ssh/known_hosts

      - name: Diagnose VM
        run: |
          ssh -i ~/.ssh/alti-vm-key alti_deployer@35.239.192.33 bash <<'EOF'
            echo "=== Hostname ==="
            hostname
            
            echo "=== Docker containers ==="
            docker ps -a --format "table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}"
            
            echo "=== Container Inspect (exit code, OOM, restarts) ==="
            docker inspect alti-backend --format '{{.State.Status}} | ExitCode={{.State.ExitCode}} | OOMKilled={{.State.OOMKilled}} | RestartCount={{.RestartCount}} | StartedAt={{.State.StartedAt}} | FinishedAt={{.State.FinishedAt}}' 2>/dev/null || echo "Container not found"
            
            echo "=== Container Healthcheck Config ==="
            docker inspect alti-backend --format '{{json .Config.Healthcheck}}' 2>/dev/null || echo "No healthcheck"
            
            echo "=== EXIT/SIGTERM messages in ALL logs ==="
            docker logs alti-backend 2>&1 | grep -i "EXIT DIAGNOSTIC\|BEFORE EXIT\|SIGTERM\|SIGINT\|shutting down\|graceful\|App is running\|listening on\|Server running\|Connected to\|Database connection\|exit code" | tail -30
            
            echo "=== Last 50 lines of backend logs ==="
            docker logs alti-backend --tail=50 2>&1
            
            echo "=== Memory usage ==="
            free -h
            
            echo "=== Compose file on VM ==="
            cat docker-compose.yml 2>/dev/null | head -30
            cat docker-compose.presenton.yml 2>/dev/null | head -30 || echo "No presenton compose"
            
            echo "=== Disk space ==="
            df -h /
          EOF

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/alti-vm-key

