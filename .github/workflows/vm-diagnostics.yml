name: VM Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Check VM Environment
    runs-on: ubuntu-latest

    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/alti-vm-key
          chmod 600 ~/.ssh/alti-vm-key
          ssh-keyscan -H 35.239.192.33 >> ~/.ssh/known_hosts

      - name: Diagnose VM
        run: |
          ssh -i ~/.ssh/alti-vm-key alti_deployer@35.239.192.33 bash <<'EOF'
            echo "=== Hostname ==="
            hostname
            
            echo "=== Current directory ==="
            pwd
            
            echo "=== Directory listing ==="
            ls -la
            
            echo "=== Docker compose file (docker-compose.yml) ==="
            cat docker-compose.yml 2>/dev/null || echo "No docker-compose.yml"
            
            echo "=== Docker compose file (docker-compose.presenton.yml) ==="
            cat docker-compose.presenton.yml 2>/dev/null || echo "No docker-compose.presenton.yml"
            
            echo "=== Docker images ==="
            docker images --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}\t{{.CreatedAt}}" | head -20
            
            echo "=== Docker containers ==="
            docker ps -a --format "table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}"
            
            echo "=== Backend Logs ==="
            docker compose logs alti-backend --tail=100 2>/dev/null || docker logs alti-backend --tail=100
            
            echo "=== Presenton Logs ==="
            docker compose logs presenton --tail=100 2>/dev/null || docker logs presenton --tail=100
            
            echo "=== Disk space ==="
            df -h /
            
            echo "=== Docker version ==="
            docker --version
            docker compose version
          EOF

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/alti-vm-key

