name: VM Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Check VM Environment
    runs-on: ubuntu-latest

    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/alti-vm-key
          chmod 600 ~/.ssh/alti-vm-key
          ssh-keyscan -H 35.239.192.33 >> ~/.ssh/known_hosts

      - name: Diagnose VM
        run: |
          ssh -i ~/.ssh/alti-vm-key alti_deployer@35.239.192.33 bash <<'EOF'
            echo "=== Hostname ==="
            hostname
            
            echo "=== Docker containers ==="
            docker ps -a --format "table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}"
            
            echo "=== Container Inspect (exit code, OOM, restarts) ==="
            docker inspect alti-backend --format '{{.State.Status}} | ExitCode={{.State.ExitCode}} | OOMKilled={{.State.OOMKilled}} | RestartCount={{.RestartCount}} | StartedAt={{.State.StartedAt}} | FinishedAt={{.State.FinishedAt}}' 2>/dev/null || echo "Container not found"
            
            echo "=== Memory usage ==="
            free -h
            
            echo "=== Docker stats (snapshot) ==="
            docker stats --no-stream --format "table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.MemPerc}}" 2>/dev/null || echo "No running containers"
            
            echo "=== OOM Killer (dmesg) ==="
            sudo dmesg -T 2>/dev/null | grep -i "oom\|killed process\|out of memory" | tail -5 || echo "No OOM events"
            
            echo "=== Backend Logs (last 200 lines) ==="
            docker logs alti-backend --tail=200 2>&1
            
            echo "=== Docker events (last 2 min) ==="
            docker events --since 2m --until 0s --format '{{.Time}} {{.Action}} {{.Actor.Attributes.name}}' 2>/dev/null | head -20 || echo "No recent events"

            echo "=== Compose file healthcheck ==="
            grep -A6 "healthcheck" docker-compose.presenton.yml 2>/dev/null || echo "No healthcheck in compose"
            
            echo "=== Disk space ==="
            df -h /
            
            echo "=== Docker version ==="
            docker --version
            docker compose version
          EOF

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/alti-vm-key

