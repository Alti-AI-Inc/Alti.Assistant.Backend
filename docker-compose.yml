# Alti AI — Docker Compose
# Sovereign deployment on Liberty Center One
# Services: Backend + Redis + MongoDB

services:
  redis:
    image: redis/redis-stack:7.4.0-v3
    container_name: alti-redis
    restart: unless-stopped
    ports:
      - "6379:6379"   # Redis
      - "8001:8001"   # Redis Insight UI
    volumes:
      - redis_data:/data
    environment:
      - REDIS_ARGS=--save 900 1 --maxmemory 512mb --maxmemory-policy allkeys-lru
    networks:
      - alti-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    container_name: alti-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - alti-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: alti-backend:latest
    container_name: alti-backend
    restart: unless-stopped
    ports:
      - "${PORT:-5100}:${PORT:-5100}"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - alti-network
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-5100}
      - REDIS_URL=redis://redis:6379
      - MONGODB_URL=mongodb://mongodb:27017/alti-ai
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:' + (process.env.PORT || 5100) + '/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 120s

networks:
  alti-network:
    driver: bridge

volumes:
  redis_data:
    driver: local
  mongodb_data:
    driver: local
