# Inso AI — Production Docker Compose
# Lean 2-service stack: Backend + Redis only
# MongoDB: Atlas (cloud-hosted, no local container needed)
# Everything else: managed GCP services (Vertex AI, Cloud Storage, Pub/Sub)
#
# Cost: ~$0 extra (Redis is already required, backend is the product)
# Disk: ~800MB total vs 8GB+ with the old full-stack

services:
  redis:
    image: redis/redis-stack:7.4.0-v3
    container_name: redis-stack
    restart: unless-stopped
    ports:
      - "6379:6379"   # Redis
      - "8001:8001"   # Redis Insight UI
    volumes:
      - redis_data:/data
    environment:
      - REDIS_ARGS=--save 900 1 --maxmemory 512mb --maxmemory-policy allkeys-lru
    networks:
      - alti-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: us-central1-docker.pkg.dev/gen-lang-client-0273900650/alti-assistant-core-backend-repo/alti-assistant-backend:latest
    container_name: alti-backend
    restart: unless-stopped
    ports:
      - "5100:5100"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - alti-network
    environment:
      - PORT=5100
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5100/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 120s

networks:
  alti-network:
    driver: bridge

volumes:
  redis_data:
    driver: local
