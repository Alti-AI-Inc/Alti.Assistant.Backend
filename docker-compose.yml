version: '3.8'

services:
  # Cognitive Memory Graph
  memgraph:
    image: memgraph/memgraph-platform:latest
    container_name: aphura-memgraph
    ports:
      - "7687:7687"
      - "3000:3000" # Memgraph Lab UI

  # Distributed Semantic Cache
  redis:
    image: redis:alpine
    container_name: aphura-redis
    ports:
      - "6379:6379"

  # Core Relational Data
  postgres:
    image: postgres:15-alpine
    container_name: aphura-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: aphura
    ports:
      - "5432:5432"

  # OpenTelemetry Collector (Mock)
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: aphura-jaeger
    ports:
      - "16686:16686" # Jaeger UI
      - "4318:4318"   # OTLP HTTP
