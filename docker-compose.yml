version: '3.8'

services:
  opensearch:
    image: opensearchproject/opensearch:latest
    container_name: aphura-opensearch
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_SECURITY_PLUGIN=true
    ports:
      - "9200:9200"
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: aphura-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
  # Async Message Queue (Kafka)
  kafka:
    image: bitnami/kafka:latest
    container_name: aphura-kafka
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
    ports:
      - "9092:9092"
  # Cognitive Memory Graph
  memgraph:
    image: memgraph/memgraph-platform:latest
    container_name: aphura-memgraph
    ports:
      - "7687:7687"
      - "3000:3000" # Memgraph Lab UI

  # Distributed Semantic Cache
  redis:
    image: redis:alpine
    container_name: aphura-redis
    ports:
      - "6379:6379"

  # Core Relational Data
  postgres:
    image: postgres:15-alpine
    container_name: aphura-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: aphura
    ports:
      - "5432:5432"

  # OpenTelemetry Collector (Mock)
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: aphura-jaeger
    ports:
      - "16686:16686" # Jaeger UI
      - "4318:4318"   # OTLP HTTP
